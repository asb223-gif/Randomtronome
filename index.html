<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Rhythm Metronome</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/vexflow@5.0.0/build/cjs/vexflow.js"></script>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">RHYTHM TRAINER</p>
        <h1>Random Rhythm Metronome</h1>
        <p class="sub">4/4 한 마디를 랜덤으로 만들고 반복 재생합니다.</p>
      </div>
      <div id="status" class="status">STOPPED</div>
    </header>

    <section class="card controls">
      <div class="control-row">
        <label>리듬 범위</label>
        <div class="segmented">
          <button class="mode active" data-mode="sixteenth">16분음표만</button>
          <button class="mode" data-mode="mixed">16분음표 + 3연음</button>
          <button class="mode" data-mode="triplet">3연음만</button>
        </div>
      </div>

      <div class="control-row">
        <label for="tripletChance">3연음 비율 <span id="tripletChanceValue">30%</span></label>
        <input id="tripletChance" type="range" min="0" max="100" value="30">
        <p class="hint">혼합 모드에서만 적용됩니다.</p>
      </div>

      <div class="control-row bpm-row">
        <label for="bpm">BPM</label>
        <div class="bpm-control">
          <button id="bpmDown">−</button>
          <input id="bpm" type="number" min="40" max="240" value="90">
          <button id="bpmUp">+</button>
        </div>
      </div>

      <div class="control-row">
        <label>클릭</label>
        <label class="switch">
          <input id="clickEnabled" type="checkbox" checked>
          <span></span>
          <b>ON</b>
        </label>
      </div>
    </section>

    <section class="card density">
      <div class="section-title">
        <div>
          <h2>박별 음 개수</h2>
          <p>각 박에서 울릴 음의 최소/최대 개수를 지정합니다.</p>
        </div>
        <button id="copyAll" class="small-btn">전체 동일 적용</button>
      </div>

      <div class="beats">
        <div class="beat-setting">
          <span>1박</span>
          <div><select id="min1"></select><span>~</span><select id="max1"></select></div>
        </div>
        <div class="beat-setting">
          <span>2박</span>
          <div><select id="min2"></select><span>~</span><select id="max2"></select></div>
        </div>
        <div class="beat-setting">
          <span>3박</span>
          <div><select id="min3"></select><span>~</span><select id="max3"></select></div>
        </div>
        <div class="beat-setting">
          <span>4박</span>
          <div><select id="min4"></select><span>~</span><select id="max4"></select></div>
        </div>
      </div>
    </section>

    <section class="card score-card">
      <div class="section-title">
        <div>
          <h2>Random Rhythm</h2>
          <p id="rhythmSummary">Play를 누르면 새로운 리듬이 생성됩니다.</p>
        </div>
        <div class="beat-indicator">
          <span data-beat="0">1</span><span data-beat="1">2</span>
          <span data-beat="2">3</span><span data-beat="3">4</span>
        </div>
      </div>
      <div id="score"></div>
    </section>

    <div class="actions">
      <button id="play" class="primary">▶ Play</button>
      <button id="stop" class="secondary">■ Stop</button>
      <button id="generate" class="secondary">↻ 새 리듬</button>
    </div>

    <footer>
      VexFlow notation · Web Audio API
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
