<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Randomtronome</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <div><div class="kicker">RHYTHM TRAINER</div><h1>Randomtronome</h1></div>
    <div id="status" class="status">STOPPED</div>
  </header>

  <section class="score-card notation-card">
    <div id="notation"></div>
  </section>

  <section class="score-card">
    <div class="score-head">
      <div><strong>RANDOM RHYTHM</strong><small id="summary">새 리듬을 생성합니다</small></div>
      <button id="generate" class="icon-btn">↻</button>
    </div>
    <div id="score"></div>
    <div id="beatDots" class="beat-dots"><i></i><i></i><i></i><i></i></div>
  </section>

  <section class="panel">
    <label>리듬</label>
    <div class="modes">
      <button data-mode="sixteenth" class="active">16분</button>
      <button data-mode="mixed">16분 + 3연음</button>
      <button data-mode="triplet">3연음</button>
    </div>

    <div id="tripletBox" class="row muted-row">
      <span>3연음 출현</span>
      <input id="tripletChance" type="range" min="0" max="100" value="30">
      <b id="chanceText">30%</b>
    </div>

    <div class="bpm-block">
      <small>BPM</small>
      <div id="bpmSwipe" class="bpm-swipe" aria-label="BPM 조절">
        <button id="minus" aria-label="BPM 감소">−</button>
        <input id="bpm" value="90" inputmode="numeric" aria-label="BPM">
        <button id="plus" aria-label="BPM 증가">+</button>
      </div>
      <div class="swipe-hint">← 쓸어서 느리게 · 빠르게 →</div>
    </div>
    <div class="row">
      <span>박자 Click</span>
      <label class="toggle"><input id="click" type="checkbox" checked><span></span></label>
    </div>
  </section>

  <section class="panel beat-count-panel">
    <button id="beatToggle" class="collapse-head" type="button" aria-expanded="false">
      <div><strong>박별 음 개수</strong><small>각 박에서 울리는 음의 범위</small></div>
      <span class="chevron">⌄</span>
    </button>
    <div id="beatPanelBody" class="collapse-body" hidden>
      <div class="beat-tools"><button id="applyAll" class="text-btn">1박 설정 전체 적용</button></div>
      <div id="beatSettings" class="beat-settings"></div>
    </div>
  </section>

  <div class="bottom-space"></div>
</main>

<nav class="transport">
  <button id="play" class="play">▶ <span>PLAY</span></button>
</nav>
<script src="app.js"></script>
</body>
</html>
